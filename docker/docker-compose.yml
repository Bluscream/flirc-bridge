services:
  flirc-bridge:
    image: bluscream1/flirc-bridge:latest
    container_name: flirc-bridge
    restart: unless-stopped
    privileged: false
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-localhost}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-homeassistant}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-flirc_bridge}
      MQTT_DEVICE_NAME: ${MQTT_DEVICE_NAME:-Flirc MQTT Bridge}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-flirc_bridge}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-homeassistant}
      MQTT_RETAIN: ${MQTT_RETAIN:-true}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      AUTO_STORE_PATTERNS: ${AUTO_STORE_PATTERNS:-false}
      WEB_TOKEN: ${WEB_TOKEN:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
      DB_URI: ${DB_URI:-sqlite:////data/patterns.db}
      INSTANCE_NAME: ${INSTANCE_NAME:-Flirc MQTT Bridge}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/flirc:/dev/flirc
      # - /
